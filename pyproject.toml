[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "selective-marl-adaptation"
version = "0.1.0"
description = "Benchmark for diagnosing semantic and behavioral shifts in cooperative multi-agent reinforcement learning."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Victor Antonio Batista Caus" }
]
dependencies = [
  "mpe2>=0.0.1",
  "numpy>=1.26",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
analysis = [
  "matplotlib>=3.8",
  "pandas>=2.1",
  "seaborn>=0.13",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
]

[project.scripts]
selective-marl-smoke = "selective_marl.experiments.smoke_reference:main"

[tool.hatch.build.targets.wheel]
packages = ["src/selective_marl"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

